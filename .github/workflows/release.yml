name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история и теги для MinVer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (framework-dependent)
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -o publish/fd

      - name: Publish (self-contained, no runtime required)
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/sc

      - name: Pack distributions
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive -Path publish/fd/mdview.exe -DestinationPath "mdview-$v-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/sc/mdview.exe -DestinationPath "mdview-$v-${{ matrix.rid }}-selfcontained.zip"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: |
            mdview-*-${{ matrix.rid }}.zip
            mdview-*-${{ matrix.rid }}-selfcontained.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
